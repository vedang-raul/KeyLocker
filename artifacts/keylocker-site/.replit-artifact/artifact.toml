kind = "web"
previewPath = "/"
title = "KeyLocker"
description = "The KeyLocker secure command center for managing API access requests, approvals, and encrypted key delivery."
version = "1.0.0"
id = "artifacts/keylocker-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18782

[services.development]
run = "pnpm --filter @workspace/keylocker-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/keylocker-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/keylocker-site/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18782"
BASE_PATH = "/"
